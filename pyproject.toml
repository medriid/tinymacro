[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-macro"
version = "0.1.2"
description = "A deterministic PyQt6 macro recorder for Linux and Windows desktops."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tiny Macro Contributors" }]
dependencies = [
  "PyQt6>=6.7",
  "pynput>=1.7.6; platform_system == 'Linux'",
  "evdev>=1.7; platform_system == 'Linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-qt>=4.4",
  "opencv-python-headless>=4.9",
  "mss>=9.0",
  "numpy>=1.26",
]
# On-screen image matching for the "click image" step and image-triggered
# scheduler. Headless OpenCV avoids shipping a second Qt that would clash with
# PyQt6's platform plugins inside the PyInstaller bundle.
vision = [
  "opencv-python-headless>=4.9",
  "mss>=9.0",
  "numpy>=1.26",
]
build = [
  "pyinstaller>=6.9",
]

[project.scripts]
tiny-macro = "tinymacro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tinymacro.gui" = ["icons/**/*.svg", "icons/**/*.ico", "icons/**/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
