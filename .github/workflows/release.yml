name: Release

# Build native binaries for Windows, macOS, and Linux and attach them to a
# GitHub Release. Triggered by pushing a version tag (e.g. `v0.1.7`); can also be
# run manually from the Actions tab (which builds artifacts without publishing).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release and upload assets

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            spec: packaging/tiny-macro-windows.spec
            dist_dir: tiny-macro-windows   # onedir folder under dist/
            asset: tiny-macro-windows.zip
          - os: macos-14
            label: macos
            spec: packaging/tiny-macro-macos.spec
            dist_dir: tiny-macro-macos
            asset: tiny-macro-macos.zip
          - os: ubuntu-latest
            label: linux
            spec: packaging/tiny-macro-wayland.spec
            dist_dir: tiny-macro-linux
            asset: tiny-macro-linux.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyInstaller imports PyQt6 during analysis; the Qt libs dlopen these.
      - name: Install Qt/X system libraries (Linux)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfontconfig1 libfreetype6

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,vision]"

      - name: Build app (onedir)
        shell: bash
        run: pyinstaller --clean --noconfirm "${{ matrix.spec }}"

      # Ship a plain-text quickstart and an empty macros/ folder inside every zip
      # so users have somewhere obvious to keep their macros and know how to run.
      - name: Add instructions + macros folder
        shell: bash
        run: |
          APP="dist/${{ matrix.dist_dir }}"
          mkdir -p "$APP/macros"
          cat > "$APP/macros/PUT-YOUR-MACROS-HERE.txt" <<'EOF'
          Keep your Tiny Macro files here so they travel with the app:
            .tmacro / .tmacc  - Classic macros
            .tmacd            - Studio (docked) macros
            .tmplist          - playlists
            .tmbundle         - portable, optionally-encrypted playlist bundles

          Open them from inside Tiny Macro via Open or the Library. This folder is
          just a convenient home for them - the app can load macros from anywhere.
          EOF
          case "${{ matrix.label }}" in
            windows) RUN="Double-click tiny-macro-windows.exe.";;
            macos)   RUN="Run ./tiny-macro-macos (first launch: right-click > Open). Grant Accessibility + Input Monitoring in System Settings > Privacy & Security.";;
            linux)   RUN="Run ./tiny-macro-linux  (chmod +x it first if needed).";;
          esac
          cat > "$APP/README.txt" <<EOF
          Tiny Macro ${{ github.ref_name }}
          =================================

          A deterministic macro recorder for Windows, macOS, and Linux.

          RUNNING
            $RUN
            Keep the executable together with the _internal folder next to it -
            they are one app. Move or shortcut the whole folder, not just the exe.

          YOUR MACROS
            Save them in the macros/ folder in here (see the note inside it).

          UPDATING
            Tiny Macro can update itself: it checks GitHub for new releases and,
            when you accept, downloads and swaps this folder in place, then relaunches.

          PROJECT
            https://github.com/medriid/tinymacro
          EOF

      # Zip the onedir folder into a single release asset. On macOS/Linux `zip`
      # preserves the executable bit so the app still runs after extraction; on
      # Windows that bit is irrelevant, so PowerShell's Compress-Archive is fine.
      - name: Package onedir as zip
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.label }}" = "windows" ]; then
            powershell -Command "Compress-Archive -Path '${{ matrix.dist_dir }}' -DestinationPath '${{ matrix.asset }}' -Force"
          else
            zip -ry "${{ matrix.asset }}" "${{ matrix.dist_dir }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-macro-${{ matrix.label }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tiny Macro ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/${{ matrix.asset }}
