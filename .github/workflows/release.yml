name: Release

# Build native binaries for Windows, macOS, and Linux and attach them to a
# GitHub Release. Triggered by pushing a version tag (e.g. `v0.1.6`); can also be
# run manually from the Actions tab (which builds artifacts without publishing).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release and upload assets

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            spec: packaging/tiny-macro-windows.spec
            built: dist/tiny-macro-windows.exe
            asset: dist/tiny-macro-windows.exe
          - os: macos-14
            label: macos
            spec: packaging/tiny-macro-macos.spec
            built: dist/tiny-macro-macos
            asset: dist/tiny-macro-macos
          - os: ubuntu-latest
            label: linux
            spec: packaging/tiny-macro-wayland.spec
            built: dist/tiny-macro-wayland
            asset: dist/tiny-macro-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyInstaller imports PyQt6 during analysis; the Qt libs dlopen these.
      - name: Install Qt/X system libraries (Linux)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfontconfig1 libfreetype6

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,vision]"

      - name: Build binary
        shell: bash
        run: pyinstaller --clean --noconfirm "${{ matrix.spec }}"

      - name: Normalise artifact name
        shell: bash
        run: |
          if [ "${{ matrix.built }}" != "${{ matrix.asset }}" ]; then
            mv "${{ matrix.built }}" "${{ matrix.asset }}"
          fi
          # macOS/Linux binaries must stay executable when downloaded.
          if [ "${{ matrix.label }}" != "windows" ]; then
            chmod +x "${{ matrix.asset }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-macro-${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tiny Macro ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ matrix.asset }}
